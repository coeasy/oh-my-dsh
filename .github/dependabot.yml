# Keep dependencies up to date. See https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "electron"
        # Electron major upgrades are coordinated manually (bundled binary).
      - dependency-name: "typescript"
        # Locked by the type-stripping test runner and esbuild setup.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
