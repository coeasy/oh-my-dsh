name: version

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: false

on:
  push:
    branches: [main]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: version & release (changesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@main
        with:
          version: 11.22.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On merge of a PR containing .changeset/*.md: open/refresh the
      # "Version Packages" PR (bumps versions + CHANGELOG, fixed group).
      # On merge of that Version Packages PR: run ci:publish which tags
      # v<version> and pushes it, triggering .github/workflows/release.yml.
      - uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
