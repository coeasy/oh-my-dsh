name: release

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: false

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@main
        with:
          version: 11.22.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Verify
        run: pnpm verify

      - name: Build and pack clients (GitHub stable engine)
        run: pnpm build:clients:stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/vscode/*.vsix
            apps/desktop/dist-release/*
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: release
    runs-on: ubuntu-latest
    env:
      # actions/download-artifact currently reaches a deprecated Buffer path
      # under Node 24; keep that upstream runtime noise out of release logs.
      NODE_OPTIONS: --no-deprecation
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="manual-${{ github.run_number }}"
          else
            release_tag="${{ github.ref_name }}"
          fi

          release_name="my-dsh ${release_tag}"
          mapfile -t assets < <(
            find dist -type f \( \
              -name 'my-dsh-Setup-*.exe' -o \
              -name 'my-dsh-*-portable.exe' -o \
              -name 'my-dsh-*-win.zip' -o \
              -name 'my-dsh-*-mac.zip' -o \
              -name 'my-dsh-*-mac.dmg' -o \
              -name 'my-dsh-*-linux.zip' -o \
              -name 'my-dsh-*-linux.AppImage' -o \
              -name 'my-dsh-*.blockmap' -o \
              -name 'my-dsh-online-Setup-*.exe' -o \
              -name 'my-dsh-online-*-portable.exe' -o \
              -name 'my-dsh-online-*-win.zip' -o \
              -name 'my-dsh-online-*-mac.zip' -o \
              -name 'my-dsh-online-*-mac.dmg' -o \
              -name 'my-dsh-online-*-linux.zip' -o \
              -name 'my-dsh-online-*-linux.AppImage' -o \
              -name 'my-dsh-online-*.blockmap' -o \
              -name '*.vsix' -o \
              -name 'SHA256SUMS.txt' \
            \) -print
          )
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were produced' >&2
            exit 1
          fi

          # gh uploads the completed asset set through one release command,
          # avoiding softprops' concurrent asset-metadata update race.
          gh release create "$release_tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_name" \
            --generate-notes \
            --draft
