name: release

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: false

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@main
        with:
          version: 11.22.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Build and pack clients (GitHub stable engine)
        run: pnpm build:clients:stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/vscode/*.vsix
            apps/desktop/dist-release/*
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: release
    runs-on: ubuntu-latest
    env:
      # actions/download-artifact currently reaches a deprecated Buffer path
      # under Node 24; keep that upstream runtime noise out of release logs.
      NODE_OPTIONS: --no-deprecation
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # A manual run has a branch ref (usually `main`), not a release tag.
          # Give it a unique tag so stale draft assets cannot collide with a
          # later verification run; tag-triggered releases keep their tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_number) || github.ref_name }}
          name: my-dsh ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_number) || github.ref_name }}
          # Auto-generated notes from merged PRs/commits; maintainers may add a
          # hand-written body first by editing the release before publishing, or
          # pre-fill from docs/release-template.md.
          generate_release_notes: true
          draft: true
          prerelease: false
          # Every manual run uses a fresh tag, so concurrent asset metadata
          # updates are unnecessary and can race inside the release action.
          overwrite_files: false
          # download-artifact also restores the unpacked Electron app trees.
          # Upload only distributable files; dist/** would publish app.asar,
          # Chromium internals, and thousands of implementation files.
          files: |
            dist/**/my-dsh-Setup-*.exe
            dist/**/my-dsh-*-portable.exe
            dist/**/my-dsh-*-win.zip
            dist/**/my-dsh-*-mac.zip
            dist/**/my-dsh-*-mac.dmg
            dist/**/my-dsh-*-linux.zip
            dist/**/my-dsh-*-linux.AppImage
            dist/**/my-dsh-*.blockmap
            dist/**/my-dsh-online-Setup-*.exe
            dist/**/my-dsh-online-*-portable.exe
            dist/**/my-dsh-online-*-win.zip
            dist/**/my-dsh-online-*-mac.zip
            dist/**/my-dsh-online-*-mac.dmg
            dist/**/my-dsh-online-*-linux.zip
            dist/**/my-dsh-online-*-linux.AppImage
            dist/**/my-dsh-online-*.blockmap
            dist/**/*.vsix
            dist/**/SHA256SUMS.txt
