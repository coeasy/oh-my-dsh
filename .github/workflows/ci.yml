name: ci

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@main
        with:
          version: 11.22.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # Keep dependency progress noise out of the build log while retaining
        # lockfile and supply-chain verification; install failures still fail CI.
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Dependency audit (high+ only)
        run: pnpm audit --prod --audit-level high

      - name: Layer audit
        run: pnpm audit:layers

      - name: Hygiene
        run: pnpm hygiene

      - name: Compile all targets
        run: pnpm compile

  pack:
    name: pack smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@main
        with:
          version: 11.22.0
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Pack VS Code VSIX
        run: pnpm pack:vscode
      - name: E2E smoke (vscode artifacts)
        run: pnpm e2e
