<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #17181a;
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(77, 107, 254, 0.18), transparent 55%),
          #f8f8f6;
        -webkit-app-region: drag;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 22px;
        padding: 48px 32px;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      .wordmark {
        margin: 0;
        font-size: clamp(32px, 6vw, 64px);
        font-weight: 650;
        letter-spacing: -0.05em;
        line-height: 1.05;
      }
      .status { margin: 0; color: #777a80; font-size: 13px; }
      .track { width: 168px; height: 3px; overflow: hidden; border-radius: 99px; background: rgba(20, 21, 24, 0.09); }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: #4d6bfe; animation: travel 1.25s ease-in-out infinite; }
      @keyframes travel { 0% { transform: translateX(-105%); } 100% { transform: translateX(345%); } }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f3f4f6;
          background:
            radial-gradient(1200px 600px at 50% -10%, rgba(77, 107, 254, 0.22), transparent 55%),
            #141416;
        }
        .status { color: #9ca0a8; }
        .track { background: rgba(255, 255, 255, 0.11); }
      }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none; width: 100%; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <main>
      <h1 class="wordmark">DeepSeek Harness</h1>
      <p class="status" id="status">Starting…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('status').textContent = '正在启动…'
      }
    </script>
  </body>
</html>
